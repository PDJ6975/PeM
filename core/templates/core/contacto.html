{% extends "base.html" %}
{% load static %}

{% block title %}Contacto - PeM{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0" style="background-color: rgba(13, 110, 253, 0.03);">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-envelope-heart text-primary" style="font-size: 3rem;"></i>
                        <h1 class="fw-bold text-primary mb-2 mt-3">Contáctanos</h1>
                        <p class="text-muted">Estamos aquí para ayudarte</p>
                    </div>

                    <form id="contactForm">
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre</label>
                            <input type="text"
                                   class="form-control"
                                   id="nombre"
                                   name="nombre"
                                   placeholder="Tu nombre completo"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email</label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   placeholder="tucorreo@ejemplo.com"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label for="mensaje" class="form-label fw-semibold">Mensaje</label>
                            <textarea class="form-control"
                                      id="mensaje"
                                      name="mensaje"
                                      rows="5"
                                      placeholder="Escribe tu mensaje aquí..."
                                      required></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-send me-2"></i>Enviar Mensaje
                            </button>
                        </div>
                    </form>

                    <!-- Mensaje de éxito (oculto por defecto) -->
                    <div id="mensajeExito" class="alert alert-success mt-4 d-none" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <strong>¡Mensaje enviado con éxito!</strong> Nos pondremos en contacto contigo pronto.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.card {
    border-radius: 16px;
}

.form-control:focus {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
}

.btn-primary {
    transition: all 0.3s ease;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('contactForm');
    const mensajeExito = document.getElementById('mensajeExito');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const nombre = document.getElementById('nombre').value;
        const email = document.getElementById('email').value;
        const mensaje = document.getElementById('mensaje').value;

        console.log('Formulario enviado:', { nombre, email, mensaje }); // simulado

        mensajeExito.classList.remove('d-none');

        form.reset();

        mensajeExito.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

        setTimeout(function() {
            mensajeExito.classList.add('d-none');
        }, 5000);
    });
});
</script>
{% endblock %}
