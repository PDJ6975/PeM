{% load static %}

<!-- Widget del carrito -->
<div class="carrito-widget-top" id="carritoWidget">
    <button class="carrito-btn-modern" type="button" data-bs-toggle="offcanvas"
            data-bs-target="#carritoOffcanvas" aria-controls="carritoOffcanvas">
        <div class="carrito-icon-wrapper">
            <i class="bi bi-cart3"></i>
            <span class="carrito-badge-modern" id="carritoBadge">0</span>
        </div>
        <div class="carrito-text">
            <span class="carrito-label">Mi Carrito</span>
            <span class="carrito-total" id="carritoTotalWidget">0,00 €</span>
        </div>
    </button>
</div>

<!-- Panel lateral del carrito -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="carritoOffcanvas" aria-labelledby="carritoOffcanvasLabel">
    <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title" id="carritoOffcanvasLabel">
            <i class="bi bi-cart3"></i> Mi Carrito
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body p-0">
        <!-- Contenido del carrito -->
        <div id="carritoContenido">
            <!-- Aquí se cargarán los productos del carrito dinámicamente -->
            <div class="text-center py-5 text-muted">
                <i class="bi bi-cart-x display-1"></i>
                <p class="mt-3">Tu carrito está vacío</p>
            </div>
        </div>
    </div>

    <!-- Footer del carrito con total y botón de checkout -->

    <div class="offcanvas-footer border-top p-3">
        <div class="d-flex justify-content-between mb-3">
            <span class="fw-bold">Total:</span>
            <span class="fw-bold text-primary" id="carritoTotal">0,00 €</span>
        </div>
        <button class="btn btn-primary w-100" id="btnProcesarPedido">
            <i class="bi bi-credit-card"></i> Procesar Pedido
        </button>
    </div>

        <!-- Stripe.js -->
    <script src="https://js.stripe.com/v3/"></script>
    <script>
    const STRIPE_PK = "{{ STRIPE_PUBLISHABLE_KEY }}";

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(";").shift();
    }
    const csrftoken = getCookie("csrftoken");

    const btnProcesar = document.getElementById("btnProcesarPedido");

    btnProcesar.addEventListener("click", async () => {

        btnProcesar.disabled = true;
        const originalHtml = btnProcesar.innerHTML;
        btnProcesar.innerHTML =
        '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Redirigiendo a pago...';

        try {
        const resp = await fetch("{% url 'create_checkout_session' %}", {
            method: "POST",
            credentials: "same-origin",
            headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrftoken
            }
        });

        if (!resp.ok) {
            const errText = await resp.text();
            throw new Error(errText || "No se pudo crear la sesión de pago.");
        }

        const data = await resp.json();
        console.log("Respuesta create_checkout_session:", data);

        if (data.url) {
            window.location.href = data.url;
            return;
        }

        const sessionId = data.id || data.sessionId;
        if (!sessionId) {
            throw new Error("Respuesta sin 'url' ni session ID ('id'/'sessionId').");
        }
        if (!STRIPE_PK) {
            throw new Error("Falta Stripe publishable key para usar Stripe.js.");
        }
        const stripe = Stripe(STRIPE_PK);
        const result = await stripe.redirectToCheckout({ sessionId });
        if (result && result.error) {
            const msg = result.error.message || result.error.description || JSON.stringify(result.error) || "Error desconocido de Stripe.js";
            throw new Error(msg);
        }

        } catch (e) {
        console.error("Fallo iniciando pago:", e);
        const msg = e?.message || e?.error?.message || (typeof e === "string" ? e : JSON.stringify(e)) || "Ocurrió un error al iniciar el pago. Inténtalo de nuevo.";
        alert("Error: " + msg);
        btnProcesar.disabled = false;
        btnProcesar.innerHTML = originalHtml;
        }
    });
    </script>

</div>
