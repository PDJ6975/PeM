{% load static %}

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container-fluid px-4">
    <!-- Logo -->
    <a class="navbar-brand fw-bold text-primary d-flex align-items-center" href="{% url 'home' %}">
      <img src="{% static 'core/img/logo.png' %}" alt="PeM" height="48" class="me-2">
    </a>

    <!-- Mobile Toggle -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Links -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <!-- Links izquierda (después del logo) -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'sobre_nosotros' %}">
            <i class="bi bi-info-circle"></i> Sobre Nosotros
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'contacto' %}">
            <i class="bi bi-envelope"></i> Contacto
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'catalogo' %}">
            <i class="bi bi-grid"></i> Catálogo
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">
            <i class="bi bi-search"></i> Buscar
          </a>
        </li>
      </ul>

      <!-- Links derecha (sesión y carrito) -->
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
        {% if user.is_authenticated %}
        <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
            data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle"></i> Mi Cuenta
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li><a class="dropdown-item" href="{% url 'mis_pedidos' %}">Mis Pedidos</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="{% url 'logout' %}">Cerrar Sesión</a></li>
            </ul>
        </li>
        {% else %}
        <li class="nav-item">
            <a class="nav-link" href="{% url 'mis_pedidos' %}">
              <i class="bi bi-truck"></i> Mis Pedidos
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{% url 'login' %}">
            <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
            </a>
        </li>
        {% endif %}

        <!-- Separador -->
        <li class="nav-item d-none d-lg-flex">
          <span class="navbar-separator"></span>
        </li>

        <!-- Carrito -->
        <li class="nav-item ms-lg-n2">
          <button class="btn btn-carrito position-relative"
                  type="button"
                  data-bs-toggle="offcanvas"
                  data-bs-target="#carritoOffcanvas"
                  aria-controls="carritoOffcanvas">
            <i class="bi bi-cart3 fs-5"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  id="carritoBadge"
                  style="font-size: 0.7rem; display: none;">
              0
            </span>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>
